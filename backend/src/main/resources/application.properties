spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=foodtrip

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodtrip}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.properties.hibernate.format-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB



aws.s3.bucket-name=foodtrip-storage
aws.region=ap-south-1
aws.access-key=${AWS_ACCESS_KEY_ID:}
aws.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.cloudfront.domain=https://d1do212giwnd6s.cloudfront.net

jwt.secret=${JWT_SECRET}